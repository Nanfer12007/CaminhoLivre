services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: caminholivre-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: caminholivre
      RABBITMQ_DEFAULT_PASS: caminholivre123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data: